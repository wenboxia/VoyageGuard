<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoyageGuard · 出行气象决策助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060a12;
      --surface: #0b1422;
      --surface2: #0f1c30;
      --border: #162340;
      --border-bright: #1e3356;
      --cyan: #00c8e8;
      --cyan-dim: rgba(0, 200, 232, 0.08);
      --cyan-mid: rgba(0, 200, 232, 0.2);
      --amber: #f0b429;
      --amber-dim: rgba(240, 180, 41, 0.1);
      --green: #00e676;
      --green-dim: rgba(0, 230, 118, 0.1);
      --red: #ff4060;
      --red-dim: rgba(255, 64, 96, 0.1);
      --text: #a8c0d8;
      --text-bright: #d4e8f8;
      --text-muted: #3a5870;
      --mono: 'IBM Plex Mono', 'SF Mono', monospace;
      --sans: 'Outfit', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
      background-image: radial-gradient(circle, rgba(0,200,232,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border: 1.5px solid var(--cyan);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--cyan);
      letter-spacing: -1px;
      background: var(--cyan-dim);
      box-shadow: 0 0 20px rgba(0,200,232,0.12);
      flex-shrink: 0;
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-tag {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.28em;
      color: var(--cyan);
      text-transform: uppercase;
      line-height: 1;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-bright);
      letter-spacing: -0.3px;
      line-height: 1;
    }

    .header-sub {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
    }

    .header-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent 0%, var(--border-bright) 20%, var(--cyan-mid) 50%, var(--border-bright) 80%, transparent 100%);
      margin-top: 18px;
    }

    /* ─── Card ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      position: relative;
    }

    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
    }
    .card::before {
      top: -1px; left: -1px;
      border-top: 1.5px solid var(--cyan);
      border-left: 1.5px solid var(--cyan);
      border-radius: 4px 0 0 0;
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-bottom: 1.5px solid var(--cyan);
      border-right: 1.5px solid var(--cyan);
      border-radius: 0 0 4px 0;
    }

    /* ─── Section label ─── */
    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ─── Preset buttons ─── */
    .preset-group {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .preset-btn {
      flex: 1;
      padding: 10px 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 2px solid transparent;
      border-radius: 8px;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
      line-height: 1.5;
    }
    .preset-btn:hover {
      border-color: var(--cyan);
      border-left-color: var(--cyan);
      color: var(--text-bright);
      background: var(--cyan-dim);
    }
    .preset-btn .preset-name { font-weight: 600; display: block; }
    .preset-btn .preset-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; display: block; }

    /* ─── Transport toggle ─── */
    .toggle-wrap {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      flex: 1;
      padding: 9px 10px;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .toggle-btn:hover { color: var(--text); }
    .toggle-btn.active {
      background: var(--surface);
      color: var(--cyan);
      font-weight: 600;
      box-shadow: 0 1px 8px rgba(0,0,0,0.5), inset 0 0 0 1px var(--border-bright);
    }

    /* ─── Route inputs ─── */
    .route-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: end;
      margin-bottom: 14px;
    }

    .route-arrow {
      color: var(--text-muted);
      font-size: 16px;
      padding-bottom: 11px;
      text-align: center;
    }

    .input-group { display: flex; flex-direction: column; gap: 5px; }

    .input-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      height: 44px;
      color: var(--text-bright);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    input[type="text"]::placeholder { color: var(--text-muted); font-weight: 400; }
    input[type="text"]:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,200,232,0.1);
    }

    /* ─── Date buttons ─── */
    .date-group {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .date-btn {
      flex: 1;
      padding: 10px 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .date-btn:hover { border-color: var(--cyan); color: var(--text); }
    .date-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: var(--cyan-dim);
    }
    .date-btn .day-label { font-size: 13px; font-weight: 600; }
    .date-btn .date-val { font-family: var(--mono); font-size: 11px; }

    /* ─── Submit ─── */
    .submit-btn {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #00b8d4 0%, #0077a8 100%);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.03em;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%);
      pointer-events: none;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* ─── Loading ─── */
    #loading {
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .loading-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .pulse-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--border-bright);
      border-top-color: var(--cyan);
      animation: spin 0.9s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 0.15em;
    }

    .loading-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      font-family: var(--mono);
    }

    /* Step log */
    .step-log-wrap {
      position: relative;
    }
    .step-log-label {
      position: absolute;
      top: -7px;
      left: 14px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      background: var(--surface);
      padding: 0 6px;
      text-transform: uppercase;
      z-index: 1;
    }

    .step-log {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-height: 48px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 12px;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .step-item.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .step-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .step-icon.done {
      background: rgba(0,230,118,0.1);
      border-color: var(--green);
      color: var(--green);
    }
    .step-icon.active {
      border-color: var(--cyan);
      color: var(--cyan);
      animation: pulse-icon 1.2s ease infinite;
    }
    @keyframes pulse-icon {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,200,232,0.3); }
      50% { box-shadow: 0 0 0 4px rgba(0,200,232,0); }
    }

    .step-text { color: var(--text-muted); line-height: 1.4; }
    .step-text.active { color: var(--text); }
    .step-text.done { color: var(--text-muted); }

    /* ─── Result ─── */
    #result { display: none; }

    .risk-hero {
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .risk-hero::before, .risk-hero::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
    }
    .risk-hero::before { top: -1px; left: -1px; border-top: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan); border-radius: 4px 0 0 0; }
    .risk-hero::after  { bottom: -1px; right: -1px; border-bottom: 1.5px solid var(--cyan); border-right: 1.5px solid var(--cyan); border-radius: 0 0 4px 0; }

    .risk-hero-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 28px 20px 22px;
    }

    .risk-hero.LOW    .risk-hero-top { background: linear-gradient(180deg, rgba(0,230,118,0.07) 0%, transparent 100%); border-bottom: 1px solid rgba(0,230,118,0.12); }
    .risk-hero.MEDIUM .risk-hero-top { background: linear-gradient(180deg, rgba(240,180,41,0.07) 0%, transparent 100%); border-bottom: 1px solid rgba(240,180,41,0.15); }
    .risk-hero.HIGH   .risk-hero-top { background: linear-gradient(180deg, rgba(255,64,96,0.09) 0%, transparent 100%); border-bottom: 1px solid rgba(255,64,96,0.18); }

    .risk-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border: 2px solid;
    }
    .LOW    .risk-icon { background: var(--green-dim); border-color: rgba(0,230,118,0.35); color: var(--green); }
    .MEDIUM .risk-icon { background: var(--amber-dim); border-color: rgba(240,180,41,0.35); color: var(--amber); }
    .HIGH   .risk-icon { background: var(--red-dim);   border-color: rgba(255,64,96,0.35);  color: var(--red); }

    .risk-level-code {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .LOW    .risk-level-code { color: var(--green); }
    .MEDIUM .risk-level-code { color: var(--amber); }
    .HIGH   .risk-level-code { color: var(--red); }

    .risk-label-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-bright);
    }

    .go-badge {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 99px;
      letter-spacing: 0.05em;
    }
    .go-badge.yes { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,230,118,0.25); }
    .go-badge.no  { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.25); }

    /* Rule override badge */
    .rule-override-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(240,180,41,0.05);
    }
    .override-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      flex-shrink: 0;
      animation: blink 1.6s ease infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .override-text {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--amber);
      letter-spacing: 0.07em;
    }

    /* Info cards */
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--border-bright);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.3s ease forwards;
    }
    .info-card:nth-child(2) { animation-delay: 0.06s; }
    .info-card:nth-child(3) { animation-delay: 0.13s; }
    .info-card:nth-child(4) { animation-delay: 0.20s; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .info-card.weather  { border-left-color: var(--cyan); }
    .info-card.analysis { border-left-color: var(--amber); }
    .info-card.advice   { border-left-color: #818cf8; }

    .info-card-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .info-card-body {
      font-size: 14px;
      line-height: 1.72;
      color: var(--text);
    }

    /* ─── Error ─── */
    #error {
      display: none;
      background: var(--red-dim);
      border: 1px solid rgba(255,64,96,0.2);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
    }
    #error p { color: var(--red); font-size: 14px; margin-bottom: 14px; }
    .retry-btn {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 9px 24px;
      border-radius: 7px;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
    }
    .retry-btn:hover { background: var(--red-dim); }

    /* ─── Footer ─── */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.07em;
      line-height: 1.8;
    }

    @media (max-width: 380px) {
      .route-row { grid-template-columns: 1fr; }
      .route-arrow { display: none; }
    }

    /* ─── UNKNOWN：证据不足（第四态）─── */
    .risk-hero.UNKNOWN .risk-hero-top {
      background: linear-gradient(180deg, rgba(148,163,184,0.07) 0%, transparent 100%);
      border-bottom: 1px solid rgba(148,163,184,0.16);
    }
    .UNKNOWN .risk-icon {
      background: rgba(148,163,184,0.1);
      border-color: rgba(148,163,184,0.35);
      color: #94a3b8;
    }
    .UNKNOWN .risk-level-code { color: #94a3b8; }

    /* ─── 船型选择 ─── */
    .vessel-wrap { display: none; margin-bottom: 16px; }
    .vessel-wrap.visible { display: block; }
    .vessel-btns { display: flex; gap: 8px; }
    .vessel-btn {
      flex: 1; padding: 10px 8px; min-height: 44px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); cursor: pointer;
      font-family: var(--sans); font-size: 13px; line-height: 1.3;
      transition: border-color 0.18s, background 0.18s, color 0.18s;
    }
    .vessel-btn .vessel-sub {
      display: block; font-family: var(--mono); font-size: 10px;
      color: var(--text-muted); margin-top: 3px; letter-spacing: 0.04em;
    }
    .vessel-btn.active {
      border-color: var(--cyan); background: var(--cyan-dim); color: var(--text-bright);
    }
    .vessel-btn.active .vessel-sub { color: var(--cyan); }

    /* ─── 缺失证据卡片 ─── */
    .info-card.missing .info-card-header { color: #94a3b8; }
    .missing-list { margin: 0; padding-left: 18px; }
    .missing-list li { margin-bottom: 5px; }

    .date-src {
      display: block; margin-top: 3px;
      font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.02em;
      color: var(--text-muted); line-height: 1.3;
    }
    .date-btn.active .date-src { color: var(--cyan); }

    .date-hint {
      margin: -8px 0 16px; font-size: 11.5px; line-height: 1.55;
      color: var(--text-muted);
    }

    /* ─── 触发的官方判据 ─── */
    .trigger-item {
      display: flex; gap: 9px; padding: 9px 0;
      border-top: 1px solid var(--border);
    }
    .trigger-item:first-child { border-top: none; padding-top: 0; }
    .trigger-cls {
      flex-shrink: 0; align-self: flex-start; padding: 2px 7px; border-radius: 4px;
      font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.05em; white-space: nowrap;
    }
    .trigger-cls.REG  { background: rgba(255,64,96,0.12);  color: var(--red); }
    .trigger-cls.WARN { background: rgba(240,180,41,0.12); color: var(--amber); }
    .trigger-cls.PROD { background: rgba(148,163,184,0.14); color: #94a3b8; }
    .trigger-main { flex: 1; min-width: 0; }
    .trigger-text { line-height: 1.65; }
    .trigger-src {
      display: inline-block; margin-top: 3px;
      font-family: var(--mono); font-size: 10.5px;
      color: var(--text-muted); text-decoration: none; border-bottom: 1px dotted var(--text-muted);
    }
    .trigger-src:hover { color: var(--cyan); border-bottom-color: var(--cyan); }
    .authority-note {
      margin-top: 12px; padding: 10px 12px; border-radius: 7px;
      background: var(--surface2); border-left: 2px solid var(--cyan);
      font-size: 12.5px; line-height: 1.65; color: var(--text);
    }

    /* ─── 真实 agent 轨迹面板 ─── */
    .trace-panel {
      margin-top: 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .trace-summary {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 12px 14px; background: none; border: none; cursor: pointer;
      color: var(--text); font-family: var(--mono); font-size: 11.5px;
      letter-spacing: 0.06em; text-align: left;
    }
    .trace-summary:hover { background: var(--surface2); }
    .trace-caret { color: var(--text-muted); transition: transform 0.2s; }
    .trace-panel.open .trace-caret { transform: rotate(90deg); }
    .trace-meta { margin-left: auto; color: var(--text-muted); font-size: 10.5px; }
    .trace-body { display: none; padding: 4px 14px 14px; }
    .trace-panel.open .trace-body { display: block; }
    .trace-step {
      display: flex; gap: 10px; padding: 8px 0;
      border-top: 1px solid var(--border);
      font-family: var(--mono); font-size: 11px; line-height: 1.5;
    }
    .trace-badge {
      flex-shrink: 0; align-self: flex-start; padding: 2px 6px; border-radius: 4px;
      font-size: 9.5px; letter-spacing: 0.05em; white-space: nowrap;
    }
    .trace-badge.prefetch { background: rgba(0,200,232,0.12); color: var(--cyan); }
    .trace-badge.model_tool { background: rgba(240,180,41,0.12); color: var(--amber); }
    .trace-badge.llm { background: rgba(148,163,184,0.12); color: #94a3b8; }
    .trace-badge.rule { background: rgba(0,230,118,0.12); color: var(--green); }
    .trace-main { flex: 1; min-width: 0; }
    .trace-name { color: var(--text-bright); word-break: break-all; }
    .trace-detail { color: var(--text-muted); word-break: break-all; }
    .trace-err { color: var(--red); }
    .trace-ms { flex-shrink: 0; color: var(--text-muted); }
    .trace-note {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
      color: var(--text-muted); font-size: 10.5px; line-height: 1.6;
    }

    /* ─── Lang toggle ─── */
    .lang-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: 7px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: background 0.18s, box-shadow 0.18s;
    }
    .lang-toggle:hover {
      background: var(--cyan-dim);
      box-shadow: 0 0 12px rgba(0,200,232,0.15);
    }
  </style>
</head>
<body>
<button class="lang-toggle" id="lang-toggle-btn" onclick="switchLang()">EN</button>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <div class="logo-mark">VG</div>
      <div class="header-titles">
        <div class="header-tag">TRAVEL RISK AGENT</div>
        <h1>出行气象决策助手</h1>
      </div>
    </div>
    <div class="header-sub">AI 实时分析气象风险，告诉你「能不能走」</div>
    <div class="header-rule"></div>
  </div>

  <!-- Form Card -->
  <div class="card" id="form-card">
    <div class="section-label">快速体验</div>
    <div class="preset-group">
      <button class="preset-btn" onclick="loadPreset('high-air')">
        <span class="preset-name">✈️ 官方机场气象</span>
        <span class="preset-sub">METAR/TAF + 航路情报</span>
      </button>
      <button class="preset-btn" onclick="loadPreset('high-ship')">
        <span class="preset-name">🚢 跨海客滚航线</span>
        <span class="preset-sub">含航线中点采样</span>
      </button>
      <button class="preset-btn" onclick="loadPreset('low')">
        <span class="preset-name">◌ 证据不足演示</span>
        <span class="preset-sub">内陆城市选船只</span>
      </button>
    </div>

    <div class="toggle-wrap">
      <button class="toggle-btn active" id="btn-plane" onclick="setTransport('plane')">✈️ 飞机</button>
      <button class="toggle-btn" id="btn-ship" onclick="setTransport('ship')">🚢 船只</button>
    </div>

    <div class="vessel-wrap" id="vessel-wrap">
      <div class="section-label" id="vessel-label">你坐的船大概是？（不确定就不用选）</div>
      <div class="vessel-btns">
        <button class="vessel-btn" id="btn-small" onclick="setVessel('small')">
          <span class="vessel-name">小船 / 渡轮</span>
          <span class="vessel-sub">几十人，开不上车</span>
        </button>
        <button class="vessel-btn" id="btn-large" onclick="setVessel('large')">
          <span class="vessel-name">大船 / 客轮</span>
          <span class="vessel-sub">能把车开上船</span>
        </button>
        <button class="vessel-btn active" id="btn-unknown" onclick="setVessel('unknown')">
          <span class="vessel-name">不确定</span>
          <span class="vessel-sub">按最严标准算</span>
        </button>
      </div>
    </div>

    <div class="route-row">
      <div class="input-group">
        <div class="input-label">出发地</div>
        <input type="text" id="origin" placeholder="如：上海" />
      </div>
      <div class="route-arrow">→</div>
      <div class="input-group">
        <div class="input-label">目的地</div>
        <input type="text" id="destination" placeholder="如：三亚" />
      </div>
    </div>

    <div class="section-label">出行日期</div>
    <div class="date-group" id="date-group"></div>
    <div class="date-hint" id="date-hint">航空只支持今天和明天 —— 官方机场预报（TAF）约覆盖 30 小时</div>

    <button class="submit-btn" id="submit-btn" onclick="submitAssess()">开始评估</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="card" style="margin-bottom:0;">
      <div class="loading-header">
        <div class="pulse-ring"></div>
        <div>
          <div class="loading-title">AGENT RUNNING</div>
          <div class="loading-subtitle" id="loading-subtitle">正在处理请求...</div>
        </div>
      </div>
      <div class="step-log-wrap">
        <div class="step-log-label">Agent Log</div>
        <div class="step-log" id="step-log"></div>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div id="result"></div>

  <!-- Error -->
  <div id="error">
    <p id="error-msg">评估失败，请稍后重试</p>
    <button class="retry-btn" onclick="resetToForm()">重试</button>
  </div>

  <div class="footer">
    VoyageGuard<br>
    仅供参考，请以航司 / 船务官方通知为准
  </div>
</div>

<script>
  // ── State ──
  let transport = 'plane';
  let vesselType = 'unknown';
  let selectedDate = '';
  let currentLang = 'zh';
  let lastResultData = null;

  // ── Translations ──
  const T = {
    zh: {
      title:              '出行气象决策助手',

      preset_air_sub:     'METAR/TAF + 航路情报',
      preset_ship_name:   '🚢 跨海客滚航线',
      preset_ship_sub:    '含航线中点采样',
      preset_low_name:    '◌ 证据不足演示',
      preset_low_sub:     '内陆城市选船只',

      vessel_label:       '你坐的船大概是？（不确定就不用选）',
      vessel_small:       '小船 / 渡轮',
      vessel_small_sub:   '几十人，开不上车',
      vessel_large:       '大船 / 客轮',
      vessel_large_sub:   '能把车开上船',
      vessel_unknown:     '不确定',
      vessel_unknown_sub: '按最严标准算',
      taf_cov_note:       (h) => `官方机场预报（TAF）覆盖至 ${h}，之后的时段用城市地面天气补齐。`,
      date_hint_air:      '官方机场预报（TAF）约覆盖未来 30 小时，覆盖窗口随签发时刻滚动——具体覆盖到几点会写在结果里，超出部分用城市地面天气补齐',
      date_hint_sea:      '海事覆盖今天起 3 天，按航线距离沿途多点采样',
      triggers_header:    '触发的官方判据',
      cls_REG:            '法规',
      cls_WARN:           '官方预警',
      cls_PROD:           '本工具判定',
      no_trigger:         '未触发任何官方预警或禁航判据。',
      city_wx_note:       '部分气象数据来自城市地面天气而非机场跑道观测（该机场未发布 METAR/TAF，或日期超出官方预报范围）。能见度为近似值。',
      conservative_note:  '船型未指定，以上按【小船】的严标准判定。如果你坐的是能把车开上船的大船，适用的限制更宽松，实际可能正常运营。',
      missing_header:     '缺失的关键证据',
      trace_header:       'Agent 执行轨迹',
      trace_note:         '以上为本次请求的真实执行记录，非动画。确定性预取的是安全判定必需的证据，模型自主调用的是补充证据。',
      kind_prefetch:      '确定性',
      kind_model_tool:    '模型自主',
      kind_llm:           '模型',
      kind_rule:          '规则引擎',
      loading_steps:      ['正在预取气象证据...', '正在校验证据充分性...', 'AI 正在比对官方判据...', '正在生成风险评估...'],
      override_text:      '规则引擎已校正',
      original_label:     '原始判断:',
      weather_header:     '气象数据概览',
      analysis_header:    '风险分析',
      advice_header:      '备选建议',
      reassess:           '重新评估',
      error_default:      '评估失败，请稍后重试',
      retry:              '重试',
      footer_line2:       '仅供参考，请以航司 / 船务官方通知为准',
      lang_btn:           'EN',
    },
    en: {
      title:              'Weather Risk Assistant',
      page_title:         'VoyageGuard · Weather Risk Assistant',
      header_sub:         'AI-powered real-time weather risk analysis — know if you can travel',
      quick_demo:         'Quick Demo',
      preset_air_name:    '✈️ Official Airport Wx',
      preset_air_sub:     'METAR/TAF + SIGMET',
      preset_ship_name:   '🚢 Cross-strait Ferry',
      preset_ship_sub:    'with route sampling',
      preset_low_name:    '◌ Insufficient Evidence',
      preset_low_sub:     'inland cities, by ship',
      plane_btn:          '✈️ Plane',
      ship_btn:           '🚢 Ship',
      origin_label:       'Origin',
      origin_ph:          'e.g. Shanghai',
      dest_label:         'Destination',
      dest_ph:            'e.g. Sanya',
      travel_date:        'Travel Date',
      date_labels:        ['Today', 'Tomorrow', 'Day After'],
      submit:             'Assess Risk',
      assessing:          'Assessing...',
      processing:         'Processing request...',
      go_yes:             'Go Ahead',
      go_no:              'Do Not Travel',
      risk_label:         { LOW: 'Low Risk', MEDIUM: 'Medium Risk', HIGH: 'High Risk', UNKNOWN: 'Insufficient Evidence' },
      risk_code:          { LOW: 'LOW RISK', MEDIUM: 'MEDIUM RISK', HIGH: 'HIGH RISK', UNKNOWN: 'INSUFFICIENT DATA' },
      vessel_label:       'What kind of boat are you taking? (skip if unsure)',
      vessel_small:       'Small boat / ferry',
      vessel_small_sub:   'dozens of people, no cars',
      vessel_large:       'Large ship / ro-pax',
      vessel_large_sub:   'cars drive aboard',
      vessel_unknown:     'Not sure',
      vessel_unknown_sub: 'uses the strictest standard',
      taf_cov_note:       (h) => `Official airport forecast (TAF) covers until ${h}; the rest of the day is filled in with city surface weather.`,
      date_hint_air:      'Official airport forecasts (TAF) cover roughly the next 30 hours and the window rolls with each issue — the result states exactly how far it reaches; the rest is filled in with city surface weather',
      date_hint_sea:      'Sailings: today plus 2 days, sampled at several points along the route',
      triggers_header:    'Official criteria triggered',
      cls_REG:            'REGULATION',
      cls_WARN:           'OFFICIAL WARNING',
      cls_PROD:           'THIS TOOL',
      no_trigger:         'No official warning or navigation-ban criterion was triggered.',
      city_wx_note:       'Some data comes from city surface weather rather than runway observations (that airport does not publish METAR/TAF, or the date is beyond the official forecast). Visibility is approximate.',
      conservative_note:  'Vessel type unspecified, so this was assessed against the stricter small-craft standard. If you are on a large ship that carries vehicles, the limits are higher and service may well be running.',
      missing_header:     'Missing Required Evidence',
      trace_header:       'Agent Execution Trace',
      trace_note:         'This is the real execution record of this request, not an animation. Deterministic steps fetch the evidence the safety verdict requires; model-initiated steps gather supplementary evidence.',
      kind_prefetch:      'DETERMINISTIC',
      kind_model_tool:    'MODEL-CHOSEN',
      kind_llm:           'MODEL',
      kind_rule:          'RULE ENGINE',
      loading_steps:      ['Pre-fetching weather evidence...', 'Checking evidence sufficiency...', 'AI checking against official criteria...', 'Generating risk assessment...'],
      override_text:      'Rule Engine Override',
      original_label:     'Original:',
      weather_header:     'Weather Overview',
      analysis_header:    'Risk Analysis',
      advice_header:      'Alternatives',
      reassess:           'Re-assess',
      error_default:      'Assessment failed, please try again',
      retry:              'Retry',
      footer_line2:       'For reference only. Always follow official airline / shipping notifications.',
      lang_btn:           '中',
    },
  };

  function t(key) { return T[currentLang][key]; }

  // ── Lang switch ──
  function switchLang() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    document.getElementById('lang-toggle-btn').textContent = t('lang_btn');
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    document.title = t('page_title');
    applyLang();
  }

  function applyLang() {
    document.querySelector('.header h1').textContent = t('title');
    document.querySelector('.header-sub').textContent = t('header_sub');

    const sectionLabels = document.querySelectorAll('#form-card .section-label');
    if (sectionLabels[0]) sectionLabels[0].textContent = t('quick_demo');
    if (sectionLabels[1]) sectionLabels[1].textContent = t('travel_date');

    const presetBtns = document.querySelectorAll('.preset-btn');
    const presetKeys = [
      ['preset_air_name',  'preset_air_sub'],
      ['preset_ship_name', 'preset_ship_sub'],
      ['preset_low_name',  'preset_low_sub'],
    ];
    presetBtns.forEach((btn, i) => {
      btn.querySelector('.preset-name').textContent = t(presetKeys[i][0]);
      btn.querySelector('.preset-sub').textContent  = t(presetKeys[i][1]);
    });

    document.getElementById('btn-plane').textContent = t('plane_btn');
    document.getElementById('btn-ship').textContent  = t('ship_btn');

    document.getElementById('vessel-label').textContent = t('vessel_label');
    ['small', 'large', 'unknown'].forEach(k => {
      document.querySelector(`#btn-${k} .vessel-name`).textContent = t('vessel_' + k);
      document.querySelector(`#btn-${k} .vessel-sub`).textContent  = t('vessel_' + k + '_sub');
    });

    const inputLabels = document.querySelectorAll('.input-label');
    if (inputLabels[0]) inputLabels[0].textContent = t('origin_label');
    if (inputLabels[1]) inputLabels[1].textContent = t('dest_label');
    document.getElementById('origin').placeholder      = t('origin_ph');
    document.getElementById('destination').placeholder = t('dest_ph');

    rebuildDateButtons();
    document.getElementById('date-hint').textContent =
      transport === 'plane' ? t('date_hint_air') : t('date_hint_sea');

    const submitBtn = document.getElementById('submit-btn');
    if (!submitBtn.disabled) submitBtn.textContent = t('submit');

    document.querySelector('.retry-btn').textContent = t('retry');
    document.querySelector('.footer').innerHTML =
      `VoyageGuard<br>${t('footer_line2')}`;

    // Re-render result if visible
    if (document.getElementById('result').style.display !== 'none' && lastResultData) {
      renderResult(lastResultData);
    }
  }

  // ── Date buttons ──
  function rebuildDateButtons() {
    const group  = document.getElementById('date-group');
    const labels = t('date_labels');
    const now    = new Date();
    group.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() + i);
      const mm      = String(d.getMonth() + 1).padStart(2, '0');
      const dd      = String(d.getDate()).padStart(2, '0');
      const isoDate = `${d.getFullYear()}-${mm}-${dd}`;
      const btn     = document.createElement('button');
      btn.className    = 'date-btn' + (isoDate === selectedDate ? ' active' : '');
      btn.innerHTML    = `<span class="day-label">${labels[i]}</span>`
        + `<span class="date-val">${mm}/${dd}</span>`;
      btn.dataset.date = isoDate;
      btn.onclick      = () => {
        document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDate = isoDate;
        updateSubmitState();
      };
      group.appendChild(btn);
    }
  }

  // ── Init dates ──
  (function initDates() {
    const now = new Date();
    const mm  = String(now.getMonth() + 1).padStart(2, '0');
    const dd  = String(now.getDate()).padStart(2, '0');
    selectedDate = `${now.getFullYear()}-${mm}-${dd}`;
    rebuildDateButtons();
    updateSubmitState();
  })();

  // ── Presets ──
  const PRESETS = {
    // 预设只描述场景，不承诺风险等级 —— 等级取决于当天真实天气，写死名字会自相矛盾。
    // 第三个是确定性的：内陆城市选船只，不管天气如何都会弃权，
    // 而弃权恰好是这个项目最独特的能力。
    'high-air':  { origin: '上海', destination: '广州', transport: 'plane' },
    'high-ship': { origin: '烟台', destination: '大连', transport: 'ship', vessel: 'unknown' },
    'low':       { origin: '北京', destination: '西安', transport: 'ship', vessel: 'unknown' },
  };
  function loadPreset(key) {
    const p = PRESETS[key];
    if (!p) return;
    document.getElementById('origin').value      = p.origin;
    document.getElementById('destination').value = p.destination;
    setTransport(p.transport);
    if (p.vessel) setVessel(p.vessel);
    updateSubmitState();
  }

  // ── Transport / Vessel ──
  function setTransport(tp) {
    transport = tp;
    document.getElementById('btn-plane').classList.toggle('active', tp === 'plane');
    document.getElementById('btn-ship').classList.toggle('active',  tp === 'ship');
    // 船型只在海运场景下有意义 —— 两类船的禁航风速差了近一倍（6级 vs 7级）
    document.getElementById('vessel-wrap').classList.toggle('visible', tp === 'ship');
    // 两条路径的官方预报覆盖范围不同：航空用 TAF（~30h），海事用 wttr.in（3 天）
    document.getElementById('date-hint').textContent =
      tp === 'plane' ? t('date_hint_air') : t('date_hint_sea');
    rebuildDateButtons();   // 数据源标注随交通方式变
  }

  function setVessel(v) {
    vesselType = v;
    ['small', 'large', 'unknown'].forEach(k =>
      document.getElementById('btn-' + k).classList.toggle('active', v === k));
  }

  // ── Submit state ──
  function updateSubmitState() {
    const origin = document.getElementById('origin').value.trim();
    const dest   = document.getElementById('destination').value.trim();
    document.getElementById('submit-btn').disabled = !(origin && dest && selectedDate);
  }
  document.getElementById('origin').addEventListener('input', updateSubmitState);
  document.getElementById('destination').addEventListener('input', updateSubmitState);

  // ── 等待期进度提示 ──
  // 这里【不】展示具体的工具名和参数：请求还在路上，前端并不知道 agent 实际调了什么。
  // 真实轨迹在响应到达后由 renderTrace() 依据后端返回的 trace 渲染。
  let progressTimer = null;

  function startProgress() {
    const logEl = document.getElementById('step-log');
    logEl.innerHTML = '';
    const steps = t('loading_steps');
    let i = 0;

    const push = () => {
      const prev = logEl.lastElementChild;
      if (prev) {
        const icon = prev.querySelector('.step-icon');
        const txt  = prev.querySelector('.step-text');
        if (icon) { icon.className = 'step-icon done'; icon.textContent = '✓'; }
        if (txt)  txt.className = 'step-text done';
      }
      const el = document.createElement('div');
      el.className = 'step-item';
      el.innerHTML = `
        <div class="step-icon active">●</div>
        <div class="step-text active">${escHtml(steps[i])}</div>
      `;
      logEl.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
      document.getElementById('loading-subtitle').textContent = steps[i];
      i += 1;
      if (i >= steps.length) { clearInterval(progressTimer); progressTimer = null; }
    };

    push();
    progressTimer = setInterval(push, 2600);
  }

  function stopProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    document.querySelectorAll('#step-log .step-item').forEach(el => {
      const icon = el.querySelector('.step-icon');
      const txt  = el.querySelector('.step-text');
      if (icon) { icon.className = 'step-icon done'; icon.textContent = '✓'; }
      if (txt)  txt.className = 'step-text done';
    });
  }

  // ── UI helpers ──
  function show(id) {
    document.getElementById(id).style.display = id === 'loading' ? 'flex' : 'block';
  }
  function hide(id) { document.getElementById(id).style.display = 'none'; }

  function resetToForm() {
    hide('loading'); hide('result'); hide('error');
    show('form-card');
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = t('submit');
  }

  // ── Submit ──
  async function submitAssess() {
    const origin = document.getElementById('origin').value.trim();
    const dest   = document.getElementById('destination').value.trim();
    if (!origin || !dest || !selectedDate) return;

    hide('form-card'); hide('result'); hide('error');
    show('loading');
    document.getElementById('loading-subtitle').textContent = t('processing');
    startProgress();
    document.getElementById('submit-btn').textContent = t('assessing');
    document.getElementById('submit-btn').disabled = true;

    try {
      const res  = await fetch('/api/assess', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ origin, destination: dest, date: selectedDate, transport,
                               vessel_type: transport === 'ship' ? vesselType : null,
                               lang: currentLang }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || t('error_default'));
      stopProgress();
      setTimeout(() => renderResult(data), 350);
    } catch (err) {
      stopProgress();
      hide('loading');
      document.getElementById('error-msg').textContent = err.message || t('error_default');
      show('error');
    }
  }

  // ── Render result ──
  function renderResult(data) {
    lastResultData = data;
    hide('loading');

    const level   = data.risk_level || 'MEDIUM';
    const iconMap = { LOW: '✓', MEDIUM: '⚠', HIGH: '✕', UNKNOWN: '?' };
    const riskLbl = t('risk_label')[level] || escHtml(data.risk_label || level);
    const code    = t('risk_code')[level]  || level;

    // 证据不足时不显示"建议/不建议出行" —— is_go_recommended 为 null 时
    // 落成"不建议出行"就等于给了一个我们并没有依据的结论。
    const goHtml = (data.is_go_recommended === null || data.is_go_recommended === undefined)
      ? ''
      : `<span class="go-badge ${data.is_go_recommended ? 'yes' : 'no'}">${
           data.is_go_recommended ? t('go_yes') : t('go_no')}</span>`;

    const overrideHtml = data.rule_override ? `
      <div class="rule-override-badge">
        <div class="override-dot"></div>
        <div class="override-text">${t('override_text')} &nbsp;·&nbsp; ${t('original_label')} ${escHtml(data.original_risk_level || '')}</div>
      </div>` : '';

    const missing = data.missing_evidence || [];
    const missingHtml = missing.length ? `
      <div class="info-card missing">
        <div class="info-card-header"><span>◌</span>&nbsp;${t('missing_header')}</div>
        <div class="info-card-body">
          <ul class="missing-list">${missing.map(m => `<li>${escHtml(m)}</li>`).join('')}</ul>
        </div>
      </div>` : '';

    const cards = [
      renderTriggers(data),
      data.weather_summary   ? card('◈', t('weather_header'),  data.weather_summary, 'weather')  : '',
      data.core_reason       ? card('◆', t('analysis_header'), data.core_reason,     'analysis') : '',
      missingHtml,
      data.alternative_advice ? card('◇', t('advice_header'),  data.alternative_advice, 'advice') : '',
    ].join('');

    document.getElementById('result').innerHTML = `
      <div class="risk-hero ${level}">
        <div class="risk-hero-top">
          <div class="risk-icon">${iconMap[level] || '?'}</div>
          <div class="risk-level-code">${code}</div>
          <div class="risk-label-text">${riskLbl}</div>
          ${goHtml}
        </div>
        ${overrideHtml}
      </div>
      ${cards}
      ${renderTrace(data)}
      <button class="submit-btn" onclick="resetToForm()" style="margin-top:4px">${t('reassess')}</button>
    `;
    show('result');
  }

  function card(icon, header, body, cls) {
    return `
      <div class="info-card ${cls}">
        <div class="info-card-header"><span>${icon}</span>&nbsp;${header}</div>
        <div class="info-card-body">${escHtml(body)}</div>
      </div>`;
  }

  // ── 触发的官方判据 ──
  // 这一块完全由后端规则引擎产出，模型不参与 —— 避免措辞被模型稀释成"停航预警"这类断言。
  // 每条都标了来源类型：法规 / 官方预警 / 本工具判定，并链到出处。
  function renderTriggers(data) {
    const trig = data.triggers || [];
    const lvl  = data.risk_level;
    if (lvl === 'UNKNOWN') return '';
    const ev0 = data.evidence || {};
    const cityWx0 = Object.values(ev0.locations || {})
      .some(l => ['city_surface', 'mixed'].includes((l.atmos || {}).quality));
    const cov0 = Object.values(ev0.locations || {})
      .map(l => (l.atmos || {}).taf_cov_to).filter(Boolean).sort()[0];
    if (!trig.length) {
      if (lvl !== 'LOW') return '';
      return `
        <div class="info-card triggers">
          <div class="info-card-header"><span>○</span>&nbsp;${t('triggers_header')}</div>
          <div class="info-card-body">${escHtml(t('no_trigger'))}
            ${cov0 ? `<div class="authority-note">${t('taf_cov_note')(fmtTime(cov0))}</div>` : ''}
            ${cityWx0 ? `<div class="authority-note">${t('city_wx_note')}</div>` : ''}</div>
        </div>`;
    }

    const rows = trig.map(x => `
      <div class="trigger-item">
        <span class="trigger-cls ${escHtml(x.cls)}">${t('cls_' + x.cls) || escHtml(x.cls)}</span>
        <div class="trigger-main">
          <div class="trigger-text">${escHtml(x.location)} — ${escHtml(x.text)}</div>
          ${x.source_url
            ? `<a class="trigger-src" href="${escHtml(x.source_url)}" target="_blank" rel="noopener">〔${escHtml(x.source)}〕</a>`
            : `<span class="trigger-src">〔${escHtml(x.source)}〕</span>`}
        </div>
      </div>`).join('');

    const ev = data.evidence || {};
    const conservative = (ev.transport === 'ship' && (ev.vessel_type === 'unknown' || !ev.vessel_type))
      ? `<div class="authority-note">${t('conservative_note')}</div>` : '';
    // 数据源差异要让用户看得见：官方机场气象 vs 城市地面天气
    const usedCityWx = Object.values(ev.locations || {})
      .some(l => ['city_surface', 'mixed'].includes((l.atmos || {}).quality));
    const cityNote = usedCityWx ? `<div class="authority-note">${t('city_wx_note')}</div>` : '';
    // 官方预报到底覆盖到几点 —— 用户要拿它对自己的航班时间
    const covTo = Object.values(ev.locations || {})
      .map(l => (l.atmos || {}).taf_cov_to).filter(Boolean).sort()[0];
    const covNote = covTo
      ? `<div class="authority-note">${t('taf_cov_note')(fmtTime(covTo))}</div>` : '';

    return `
      <div class="info-card triggers">
        <div class="info-card-header"><span>◈</span>&nbsp;${t('triggers_header')}</div>
        <div class="info-card-body">${rows}${conservative}${covNote}${cityNote}</div>
      </div>`;
  }

  // ── 真实 agent 轨迹 ──
  // 数据全部来自后端返回的 trace，每一步的耗时和成败都是真实发生过的。
  function renderTrace(data) {
    const trace = data.trace || [];
    if (!trace.length) return '';
    const meta = data.meta || {};

    const rows = trace.map(step => {
      const kind  = step.kind || 'llm';
      const badge = t('kind_' + kind) || kind;
      const args  = step.args && Object.keys(step.args).length
        ? JSON.stringify(step.args) : '';
      const detail = step.error
        ? `<div class="trace-err">✕ ${escHtml(step.error)}</div>`
        : (step.summary ? `<div class="trace-detail">${escHtml(step.summary)}</div>` : '');
      return `
        <div class="trace-step">
          <span class="trace-badge ${kind}">${escHtml(badge)}</span>
          <div class="trace-main">
            <div class="trace-name">${step.ok ? '' : '⚠ '}${escHtml(step.name || '')}${
              args ? ` <span class="trace-detail">${escHtml(args)}</span>` : ''}</div>
            ${detail}
          </div>
          <span class="trace-ms">${step.latency_ms ? step.latency_ms + 'ms' : ''}</span>
        </div>`;
    }).join('');

    const bits = [];
    if (meta.model) bits.push(escHtml(meta.model));
    if (meta.llm_rounds) bits.push(meta.llm_rounds + ' LLM');
    if (meta.tool_calls !== undefined) bits.push(meta.tool_calls + ' tools');
    if (meta.total_ms) bits.push((meta.total_ms / 1000).toFixed(1) + 's');

    return `
      <div class="trace-panel" id="trace-panel">
        <button class="trace-summary" onclick="document.getElementById('trace-panel').classList.toggle('open')">
          <span class="trace-caret">▸</span>
          <span>${t('trace_header')} · ${trace.length}</span>
          <span class="trace-meta">${bits.join(' · ')}</span>
        </button>
        <div class="trace-body">
          ${rows}
          <div class="trace-note">${t('trace_note')}</div>
        </div>
      </div>`;
  }

  // epoch 秒 → 北京时间「MM-DD HH:MM」
  function fmtTime(epoch) {
    const d = new Date(epoch * 1000 + 8 * 3600 * 1000);
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
  }
</script>
</body>
