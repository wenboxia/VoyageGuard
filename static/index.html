<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoyageGuard · 出行气象决策助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060a12;
      --surface: #0b1422;
      --surface2: #0f1c30;
      --border: #162340;
      --border-bright: #1e3356;
      --cyan: #00c8e8;
      --cyan-dim: rgba(0, 200, 232, 0.08);
      --cyan-mid: rgba(0, 200, 232, 0.2);
      --amber: #f0b429;
      --amber-dim: rgba(240, 180, 41, 0.1);
      --green: #00e676;
      --green-dim: rgba(0, 230, 118, 0.1);
      --red: #ff4060;
      --red-dim: rgba(255, 64, 96, 0.1);
      --text: #a8c0d8;
      --text-bright: #d4e8f8;
      --text-muted: #3a5870;
      --mono: 'IBM Plex Mono', 'SF Mono', monospace;
      --sans: 'Outfit', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
      background-image: radial-gradient(circle, rgba(0,200,232,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border: 1.5px solid var(--cyan);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--cyan);
      letter-spacing: -1px;
      background: var(--cyan-dim);
      box-shadow: 0 0 20px rgba(0,200,232,0.12);
      flex-shrink: 0;
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-tag {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.28em;
      color: var(--cyan);
      text-transform: uppercase;
      line-height: 1;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-bright);
      letter-spacing: -0.3px;
      line-height: 1;
    }

    .header-sub {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
    }

    .header-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent 0%, var(--border-bright) 20%, var(--cyan-mid) 50%, var(--border-bright) 80%, transparent 100%);
      margin-top: 18px;
    }

    /* ─── Card ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      position: relative;
    }

    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
    }
    .card::before {
      top: -1px; left: -1px;
      border-top: 1.5px solid var(--cyan);
      border-left: 1.5px solid var(--cyan);
      border-radius: 4px 0 0 0;
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-bottom: 1.5px solid var(--cyan);
      border-right: 1.5px solid var(--cyan);
      border-radius: 0 0 4px 0;
    }

    /* ─── Section label ─── */
    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ─── Preset buttons ─── */
    .preset-group {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .preset-btn {
      flex: 1;
      padding: 10px 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 2px solid transparent;
      border-radius: 8px;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
      line-height: 1.5;
    }
    .preset-btn:hover {
      border-color: var(--cyan);
      border-left-color: var(--cyan);
      color: var(--text-bright);
      background: var(--cyan-dim);
    }
    .preset-btn .preset-name { font-weight: 600; display: block; }
    .preset-btn .preset-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; display: block; }

    /* ─── Transport toggle ─── */
    .toggle-wrap {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      flex: 1;
      padding: 9px 10px;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .toggle-btn:hover { color: var(--text); }
    .toggle-btn.active {
      background: var(--surface);
      color: var(--cyan);
      font-weight: 600;
      box-shadow: 0 1px 8px rgba(0,0,0,0.5), inset 0 0 0 1px var(--border-bright);
    }

    /* ─── Route inputs ─── */
    .route-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: end;
      margin-bottom: 14px;
    }

    .route-arrow {
      color: var(--text-muted);
      font-size: 16px;
      padding-bottom: 11px;
      text-align: center;
    }

    .input-group { display: flex; flex-direction: column; gap: 5px; }

    .input-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      height: 44px;
      color: var(--text-bright);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    input[type="text"]::placeholder { color: var(--text-muted); font-weight: 400; }
    input[type="text"]:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,200,232,0.1);
    }

    /* ─── Date buttons ─── */
    .date-group {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .date-btn {
      flex: 1;
      padding: 10px 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .date-btn:hover { border-color: var(--cyan); color: var(--text); }
    .date-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: var(--cyan-dim);
    }
    .date-btn .day-label { font-size: 13px; font-weight: 600; }
    .date-btn .date-val { font-family: var(--mono); font-size: 11px; }

    /* ─── Submit ─── */
    .submit-btn {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #00b8d4 0%, #0077a8 100%);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.03em;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%);
      pointer-events: none;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* ─── Loading ─── */
    #loading {
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .loading-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .pulse-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--border-bright);
      border-top-color: var(--cyan);
      animation: spin 0.9s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 0.15em;
    }

    .loading-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      font-family: var(--mono);
    }

    /* Step log */
    .step-log-wrap {
      position: relative;
    }
    .step-log-label {
      position: absolute;
      top: -7px;
      left: 14px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      background: var(--surface);
      padding: 0 6px;
      text-transform: uppercase;
      z-index: 1;
    }

    .step-log {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-height: 48px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 12px;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .step-item.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .step-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .step-icon.done {
      background: rgba(0,230,118,0.1);
      border-color: var(--green);
      color: var(--green);
    }
    .step-icon.active {
      border-color: var(--cyan);
      color: var(--cyan);
      animation: pulse-icon 1.2s ease infinite;
    }
    @keyframes pulse-icon {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,200,232,0.3); }
      50% { box-shadow: 0 0 0 4px rgba(0,200,232,0); }
    }

    .step-text { color: var(--text-muted); line-height: 1.4; }
    .step-text.active { color: var(--text); }
    .step-text.done { color: var(--text-muted); }

    /* ─── Result ─── */
    #result { display: none; }

    .risk-hero {
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .risk-hero::before, .risk-hero::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
    }
    .risk-hero::before { top: -1px; left: -1px; border-top: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan); border-radius: 4px 0 0 0; }
    .risk-hero::after  { bottom: -1px; right: -1px; border-bottom: 1.5px solid var(--cyan); border-right: 1.5px solid var(--cyan); border-radius: 0 0 4px 0; }

    .risk-hero-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 28px 20px 22px;
    }

    .risk-hero.LOW    .risk-hero-top { background: linear-gradient(180deg, rgba(0,230,118,0.07) 0%, transparent 100%); border-bottom: 1px solid rgba(0,230,118,0.12); }
    .risk-hero.MEDIUM .risk-hero-top { background: linear-gradient(180deg, rgba(240,180,41,0.07) 0%, transparent 100%); border-bottom: 1px solid rgba(240,180,41,0.15); }
    .risk-hero.HIGH   .risk-hero-top { background: linear-gradient(180deg, rgba(255,64,96,0.09) 0%, transparent 100%); border-bottom: 1px solid rgba(255,64,96,0.18); }

    .risk-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border: 2px solid;
    }
    .LOW    .risk-icon { background: var(--green-dim); border-color: rgba(0,230,118,0.35); color: var(--green); }
    .MEDIUM .risk-icon { background: var(--amber-dim); border-color: rgba(240,180,41,0.35); color: var(--amber); }
    .HIGH   .risk-icon { background: var(--red-dim);   border-color: rgba(255,64,96,0.35);  color: var(--red); }

    .risk-level-code {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .LOW    .risk-level-code { color: var(--green); }
    .MEDIUM .risk-level-code { color: var(--amber); }
    .HIGH   .risk-level-code { color: var(--red); }

    .risk-label-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-bright);
    }

    .go-badge {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 99px;
      letter-spacing: 0.05em;
    }
    .go-badge.yes { background: var(--green-dim); color: var(--green); border: 1px solid rgba(0,230,118,0.25); }
    .go-badge.no  { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(255,64,96,0.25); }

    /* Rule override badge */
    .rule-override-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(240,180,41,0.05);
    }
    .override-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      flex-shrink: 0;
      animation: blink 1.6s ease infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .override-text {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--amber);
      letter-spacing: 0.07em;
    }

    /* Info cards */
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--border-bright);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.3s ease forwards;
    }
    .info-card:nth-child(2) { animation-delay: 0.06s; }
    .info-card:nth-child(3) { animation-delay: 0.13s; }
    .info-card:nth-child(4) { animation-delay: 0.20s; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .info-card.weather  { border-left-color: var(--cyan); }
    .info-card.analysis { border-left-color: var(--amber); }
    .info-card.advice   { border-left-color: #818cf8; }

    .info-card-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .info-card-body {
      font-size: 14px;
      line-height: 1.72;
      color: var(--text);
    }

    /* ─── Error ─── */
    #error {
      display: none;
      background: var(--red-dim);
      border: 1px solid rgba(255,64,96,0.2);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
    }
    #error p { color: var(--red); font-size: 14px; margin-bottom: 14px; }
    .retry-btn {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 9px 24px;
      border-radius: 7px;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
    }
    .retry-btn:hover { background: var(--red-dim); }

    /* ─── Footer ─── */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.07em;
      line-height: 1.8;
    }

    @media (max-width: 380px) {
      .route-row { grid-template-columns: 1fr; }
      .route-arrow { display: none; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <div class="logo-mark">VG</div>
      <div class="header-titles">
        <div class="header-tag">TRAVEL RISK AGENT</div>
        <h1>出行气象决策助手</h1>
      </div>
    </div>
    <div class="header-sub">AI 实时分析气象风险，告诉你「能不能走」</div>
    <div class="header-rule"></div>
  </div>

  <!-- Form Card -->
  <div class="card" id="form-card">
    <div class="section-label">快速体验</div>
    <div class="preset-group">
      <button class="preset-btn" onclick="loadPreset('high-air')">
        <span class="preset-name">✈️ 航空高风险</span>
        <span class="preset-sub">大风天飞拉萨</span>
      </button>
      <button class="preset-btn" onclick="loadPreset('high-ship')">
        <span class="preset-name">🚢 海事高风险</span>
        <span class="preset-sub">近海大风停航</span>
      </button>
      <button class="preset-btn" onclick="loadPreset('low')">
        <span class="preset-name">✓ 低风险出行</span>
        <span class="preset-sub">晴天微风放心走</span>
      </button>
    </div>

    <div class="toggle-wrap">
      <button class="toggle-btn active" id="btn-plane" onclick="setTransport('plane')">✈️ 飞机</button>
      <button class="toggle-btn" id="btn-ship" onclick="setTransport('ship')">🚢 船只</button>
    </div>

    <div class="route-row">
      <div class="input-group">
        <div class="input-label">出发地</div>
        <input type="text" id="origin" placeholder="如：上海" />
      </div>
      <div class="route-arrow">→</div>
      <div class="input-group">
        <div class="input-label">目的地</div>
        <input type="text" id="destination" placeholder="如：三亚" />
      </div>
    </div>

    <div class="section-label">出行日期</div>
    <div class="date-group" id="date-group"></div>

    <button class="submit-btn" id="submit-btn" onclick="submitAssess()">开始评估</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="card" style="margin-bottom:0;">
      <div class="loading-header">
        <div class="pulse-ring"></div>
        <div>
          <div class="loading-title">AGENT RUNNING</div>
          <div class="loading-subtitle" id="loading-subtitle">正在处理请求...</div>
        </div>
      </div>
      <div class="step-log-wrap">
        <div class="step-log-label">Agent Log</div>
        <div class="step-log" id="step-log"></div>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div id="result"></div>

  <!-- Error -->
  <div id="error">
    <p id="error-msg">评估失败，请稍后重试</p>
    <button class="retry-btn" onclick="resetToForm()">重试</button>
  </div>

  <div class="footer">
    VoyageGuard · Powered by Qwen AI<br>
    仅供参考，请以航司 / 船务官方通知为准
  </div>
</div>

<script>
  // ── State ──
  let transport = 'plane';
  let selectedDate = '';

  // ── Init dates ──
  (function initDates() {
    const group = document.getElementById('date-group');
    const labels = ['今天', '明天', '后天'];
    const now = new Date();
    for (let i = 0; i < 3; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() + i);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const isoDate = `${d.getFullYear()}-${mm}-${dd}`;
      const btn = document.createElement('button');
      btn.className = 'date-btn' + (i === 0 ? ' active' : '');
      btn.innerHTML = `<span class="day-label">${labels[i]}</span><span class="date-val">${mm}/${dd}</span>`;
      btn.dataset.date = isoDate;
      btn.onclick = () => {
        document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDate = isoDate;
        updateSubmitState();
      };
      if (i === 0) selectedDate = isoDate;
      group.appendChild(btn);
    }
    updateSubmitState();
  })();

  // ── Presets ──
  const PRESETS = {
    'high-air':  { origin: '上海', destination: '拉萨',  transport: 'plane' },
    'high-ship': { origin: '舟山', destination: '嵊泗',  transport: 'ship'  },
    'low':       { origin: '杭州', destination: '南京',  transport: 'plane' },
  };
  function loadPreset(key) {
    const p = PRESETS[key];
    if (!p) return;
    document.getElementById('origin').value = p.origin;
    document.getElementById('destination').value = p.destination;
    setTransport(p.transport);
    updateSubmitState();
  }

  // ── Transport ──
  function setTransport(t) {
    transport = t;
    document.getElementById('btn-plane').classList.toggle('active', t === 'plane');
    document.getElementById('btn-ship').classList.toggle('active',  t === 'ship');
  }

  // ── Submit state ──
  function updateSubmitState() {
    const origin = document.getElementById('origin').value.trim();
    const dest   = document.getElementById('destination').value.trim();
    document.getElementById('submit-btn').disabled = !(origin && dest && selectedDate);
  }
  document.getElementById('origin').addEventListener('input', updateSubmitState);
  document.getElementById('destination').addEventListener('input', updateSubmitState);

  // ── Agent step log ──
  let stepTimers = [];

  function buildSteps(origin, dest, mode) {
    if (mode === 'plane') {
      return [
        { text: `解析出行参数`,                                   delay: 300  },
        { text: `get_weather_forecast("${origin}")`,              delay: 900  },
        { text: `get_weather_forecast("${dest}")`,                delay: 3200 },
        { text: `比对航空安全阈值（侧风 / 能见度 / 雷暴）`,       delay: 5800 },
        { text: `规则引擎安全网校验`,                             delay: 7800 },
        { text: `生成综合风险评估报告`,                           delay: 9200 },
      ];
    } else {
      return [
        { text: `解析出行参数`,                                   delay: 300  },
        { text: `get_weather_forecast("${dest}")`,                delay: 900  },
        { text: `检测风力等级（近海 ≥6级 = 高风险）`,            delay: 3200 },
        { text: `search_web("${dest} 海事天气预警")`,             delay: 5000 },
        { text: `规则引擎安全网校验`,                             delay: 7800 },
        { text: `生成综合风险评估报告`,                           delay: 9200 },
      ];
    }
  }

  function startStepLog(origin, dest, mode) {
    const logEl = document.getElementById('step-log');
    logEl.innerHTML = '';
    const steps = buildSteps(origin, dest, mode);
    let lastEl = null;

    steps.forEach((step, i) => {
      const t = setTimeout(() => {
        // Mark previous step done
        if (lastEl) {
          const icon = lastEl.querySelector('.step-icon');
          const text = lastEl.querySelector('.step-text');
          if (icon) { icon.className = 'step-icon done'; icon.textContent = '✓'; }
          if (text) text.className = 'step-text done';
        }
        // Add new step
        const el = document.createElement('div');
        el.className = 'step-item';
        el.innerHTML = `
          <div class="step-icon active">●</div>
          <div class="step-text active">${escHtml(step.text)}</div>
        `;
        logEl.appendChild(el);
        // Trigger transition
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
        lastEl = el;
        // Update subtitle
        document.getElementById('loading-subtitle').textContent =
          step.text.replace(/^get_weather_forecast|^search_web/, t => t);
      }, step.delay);
      stepTimers.push(t);
    });
  }

  function stopStepLog() {
    stepTimers.forEach(t => clearTimeout(t));
    stepTimers = [];
    document.querySelectorAll('#step-log .step-item').forEach(el => {
      const icon = el.querySelector('.step-icon');
      const text = el.querySelector('.step-text');
      if (icon) { icon.className = 'step-icon done'; icon.textContent = '✓'; }
      if (text) text.className = 'step-text done';
    });
  }

  // ── UI helpers ──
  function show(id) {
    document.getElementById(id).style.display = id === 'loading' ? 'flex' : 'block';
  }
  function hide(id) { document.getElementById(id).style.display = 'none'; }

  function resetToForm() {
    hide('loading'); hide('result'); hide('error');
    show('form-card');
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = '开始评估';
  }

  // ── Submit ──
  async function submitAssess() {
    const origin = document.getElementById('origin').value.trim();
    const dest   = document.getElementById('destination').value.trim();
    if (!origin || !dest || !selectedDate) return;

    hide('form-card'); hide('result'); hide('error');
    show('loading');
    startStepLog(origin, dest, transport);
    document.getElementById('submit-btn').textContent = '评估中...';
    document.getElementById('submit-btn').disabled = true;

    try {
      const res = await fetch('/api/assess', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ origin, destination: dest, date: selectedDate, transport }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '请求失败');
      stopStepLog();
      setTimeout(() => renderResult(data), 350);
    } catch (err) {
      stopStepLog();
      hide('loading');
      document.getElementById('error-msg').textContent = err.message || '评估失败，请稍后重试';
      show('error');
    }
  }

  // ── Render result ──
  function renderResult(data) {
    hide('loading');

    const level = data.risk_level || 'MEDIUM';
    const iconMap  = { LOW: '✓', MEDIUM: '⚠', HIGH: '✕' };
    const codeMap  = { LOW: 'LOW RISK', MEDIUM: 'MEDIUM RISK', HIGH: 'HIGH RISK' };
    const goText   = data.is_go_recommended ? '建议出行' : '不建议出行';
    const goClass  = data.is_go_recommended ? 'yes' : 'no';

    const overrideHtml = data.rule_override ? `
      <div class="rule-override-badge">
        <div class="override-dot"></div>
        <div class="override-text">规则引擎已校正 &nbsp;·&nbsp; 原始判断: ${escHtml(data.original_risk_level || '')}</div>
      </div>` : '';

    const html = `
      <div class="risk-hero ${level}">
        <div class="risk-hero-top">
          <div class="risk-icon">${iconMap[level]}</div>
          <div class="risk-level-code">${codeMap[level]}</div>
          <div class="risk-label-text">${escHtml(data.risk_label || level)}</div>
          <span class="go-badge ${goClass}">${goText}</span>
        </div>
        ${overrideHtml}
      </div>
      <div class="info-card weather">
        <div class="info-card-header"><span>◈</span>&nbsp;气象数据概览</div>
        <div class="info-card-body">${escHtml(data.weather_summary || '')}</div>
      </div>
      <div class="info-card analysis">
        <div class="info-card-header"><span>◆</span>&nbsp;风险分析</div>
        <div class="info-card-body">${escHtml(data.core_reason || '')}</div>
      </div>
      <div class="info-card advice">
        <div class="info-card-header"><span>◇</span>&nbsp;备选建议</div>
        <div class="info-card-body">${escHtml(data.alternative_advice || '')}</div>
      </div>
      <button class="submit-btn" onclick="resetToForm()" style="margin-top:4px">重新评估</button>
    `;

    const resultEl = document.getElementById('result');
    resultEl.innerHTML = html;
    show('result');
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
  }
</script>
</body>
</html>
